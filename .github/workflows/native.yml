name: Native

# Builds the engine, the demo and the editor on the toolchains people actually
# use, runs the engine's unit tests, and builds the demo again against the
# installed package. web-demo.yml covers Emscripten and is deliberately
# separate — it publishes, this one only checks.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One red compiler should not hide what the other two think.
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            generator: -G Ninja
            # Warnings are errors where we have seen the output.
            werror: ON
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            generator: -G Ninja
            werror: ON
          - name: Windows MSVC
            os: windows-latest
            # Default generator: MSBuild, which is what a VS developer gets.
            generator: ''
            # MSVC gets /W4 but not /WX yet — nobody has read what /W4 makes of
            # this code. Turn this ON once a run has shown it is clean.
            werror: OFF

    steps:
      - uses: actions/checkout@v4

      # No system SDL3 on the runner, so CMake fetches and builds it from
      # source. These are what its Linux video backends need. Wayland and the
      # rest are optional, but once libx11-dev is there SDL3 refuses to
      # configure without each X11 extension it wants: Xcursor, Xext (DBE,
      # shape, sync), Xi, Xfixes, Xrandr, XScrnSaver and XTest.
      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev

      # Building SDL3 from source dominates the run. The cache holds both the
      # fetched sources and their build tree, keyed so that any change to the
      # dependency pins or the CMake setup invalidates it.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ matrix.cc || 'msvc' }}-${{ hashFiles('CMakeLists.txt', 'demo/CMakeLists.txt', 'tools/kek_editor/CMakeLists.txt') }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build ${{ matrix.generator }}
          -DCMAKE_BUILD_TYPE=Release
          -DKEK_WERROR=${{ matrix.werror }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # The engine's unit tests, from tests/ — Unity suites registered with
      # CTest. --no-tests=error because an empty suite would mean the tests
      # stopped being built, and that should fail rather than pass quietly.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=error

      # The library as a package, the way a game consumes it: installed, then
      # the demo configured on its own and found through find_package(kek).
      # SDL3_DIR points at the SDL3 the tree build fetched, which leaves its
      # package config in its build directory, so SDL3 is not built twice.
      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Build the demo against the installed package
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S demo -B build-demo ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release -DKEK_WERROR=${{ matrix.werror }} -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" -DSDL3_DIR="${{ github.workspace }}/build/_deps/sdl3-build"
          cmake --build build-demo --config Release --parallel

  tidy:
    name: clang-tidy
    # Pinned, both the image and the clang-tidy below: a check that appears
    # overnight in a newer release would otherwise fail a merge that changed
    # nothing. Moving either is a deliberate commit that clears what the new
    # version finds, locally, before CI sees it.
    runs-on: ubuntu-24.04
    env:
      CLANG_TIDY_VERSION: 22
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's own clang-tidy is whatever the image shipped with; apt.llvm.org
      # has one repository per major version, so the version is ours to choose.
      - name: Install dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${CLANG_TIDY_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-tidy-${CLANG_TIDY_VERSION} ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-tidy-ubuntu-24.04-${{ hashFiles('CMakeLists.txt', 'demo/CMakeLists.txt', 'tools/kek_editor/CMakeLists.txt') }}

      # clang-tidy needs compile_commands.json, which CMAKE_EXPORT_COMPILE_COMMANDS
      # writes; the build has to run first so generated headers exist.
      - name: Configure and build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel

      # Only our own sources — _deps holds SDL3, Dear ImGui and Unity, whose
      # warnings are not ours to fix. WarningsAsErrors in .clang-tidy makes any
      # finding a failed file, and the exit status is run-clang-tidy's rather
      # than tee's, so the summary is written before the step fails.
      - name: Run clang-tidy
        run: |
          status=0
          run-clang-tidy-${CLANG_TIDY_VERSION} -p build -quiet \
            '^${{ github.workspace }}/(kek|demo|tools|tests|bench)/' \
            > tidy.log 2>&1 || status=$?
          cat tidy.log
          echo "### clang-tidy ${CLANG_TIDY_VERSION}: $(grep -cE ': (warning|error): ' tidy.log) findings" >> "$GITHUB_STEP_SUMMARY"
          exit $status
